; Firmware BRACCIO. Contratto con la web app: docs/03-protocollo.md
;   pio run -e esp32dev -t upload     firmware
;   pio run -e esp32dev -t uploadfs   web app (firmware/data/, la riempie la build di web/)
;   pio test -e native                planner, limiti, taratura sul PC

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0  ; arduino-esp32 2.0.17: LEDC con ledcSetup/ledcAttachPin
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.12.1
    bblanchon/ArduinoJson@^7.4.0
build_flags = -Wall

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<motion.cpp>
